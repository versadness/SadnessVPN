# Separate nginx instance: no includes from the VPS application configuration.
user www-data;
worker_processes 1;
pid /run/sadness-updates/nginx.pid;
error_log /var/log/sadness-updates/error.log warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    sendfile on;
    server {
        listen 8444 ssl;
        server_name mygermany2.duckdns.org;
        ssl_certificate /etc/letsencrypt/live/mygermany2.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mygermany2.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /var/www/sadness-vpn;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        location = /updates/health {
            default_type text/plain;
            add_header Cache-Control no-store always;
            return 200 "Sadness VPN updates ready\n";
        }
        location ~ ^/updates/(beta|stable)\.json$ {
            default_type application/json;
            add_header Cache-Control no-store always;
            try_files $uri =404;
        }
        location ~ ^/updates/releases/[0-9]+\.[0-9]+\.[0-9]+/SadnessVPN-[A-Za-z0-9.-]+\.msp$ {
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
